services:
  bot:
    build: .
    user: root
    restart: unless-stopped
    # The host's Docker AppArmor profile can deny asyncio's socketpair syscall.
    security_opt:
      - apparmor=unconfined
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./secrets:/run/secrets:ro
    # Linux Docker does not provide host.docker.internal automatically.
    # Proxmox is intentionally reached through the Docker host gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true

  api:
    build: .
    user: root
    command: uvicorn web.api:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
